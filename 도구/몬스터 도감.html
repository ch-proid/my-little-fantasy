<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>몬스터 도감</title>
<style>
  @font-face { font-family: 'Galmuri11'; src: url('../글꼴/Galmuri11.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: 'Galmuri11'; src: url('../글꼴/Galmuri11-Bold.woff2') format('woff2'); font-weight: 700; }
  :root { --bg: #3a2418; --card: #5a3a28; --edge: #2e1a10; --line: #8a6040; --cream: #f6e6c8; --sub: #c9a986; --gold: #ffd24d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(ellipse at top, #5a3a28, var(--bg) 70%) fixed; color: var(--cream); font: 14px/1.5 "Galmuri11", "Malgun Gothic", sans-serif; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { margin: 0; font-size: 28px; color: #ffe8b0; text-shadow: 0 3px 0 #7a3a10; }
  header p { margin: 4px 0; color: var(--sub); }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
  .bar button { font: inherit; color: var(--cream); background: #472c1e; border: 2px solid var(--line); border-radius: 12px; padding: 4px 12px; cursor: pointer; }
  .bar button.on { background: #f0a860; color: #5a3420; border-color: #ffd8a0; font-weight: bold; }
  section { margin-top: 26px; background: rgba(0,0,0,0.18); border: 2px solid #6a4430; border-radius: 16px; padding: 12px 14px 16px; }
  h2 { margin: 0; font-size: 20px; }
  h2 small { color: var(--sub); font-size: 13px; font-weight: normal; margin-left: 8px; }
  .story { color: var(--sub); margin: 2px 0 10px; font-size: 13px; }
  canvas.lineup { display: block; width: 100%; height: auto; image-rendering: pixelated; border-radius: 10px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 10px; margin-top: 10px; }
  .card { display: flex; gap: 10px; align-items: center; background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; box-shadow: 0 3px 0 var(--edge); }
  .card.boss { border-color: #ff8a5a; }
  .card canvas { flex: none; width: 96px; height: 96px; image-rendering: pixelated; background: radial-gradient(circle, rgba(255,220,160,0.15), transparent 70%); border-radius: 8px; }
  .card b { display: block; }
  .tag { display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 99px; margin: 2px 3px 0 0; background: #2e1a10; color: var(--cream); }
  .tag.s { background: #3a6a3a; } .tag.m { background: #3a5a8a; } .tag.l { background: #8a5a2a; } .tag.b { background: #9a2a2a; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>몬스터 도감</h1>
    <p>8개 지역 · 40종. 줄 세운 그림은 게임 화면과 같은 크기(2배)이고, 맨 왼쪽은 용사입니다. 크기가 곧 강함입니다.</p>
    <div class="bar" id="zoom">배율 <button data-v="2">2배</button><button class="on" data-v="3">3배</button><button data-v="4">4배</button></div>
    <div class="bar" id="motion">움직임 <button class="on" data-v="walk">걷기</button><button data-v="slow">느리게</button><button data-v="stop">멈춤</button></div>
  </header>
  <div id="list"></div>
</div>
<script src="../코드/그림/art.js"></script>
<script src="../코드/그림/fx.js"></script>
<script src="../코드/그림/pixfx.js"></script>
<script src="../코드/그림/pixfx_list.js"></script>
<script src="../코드/그림/forge.js"></script>
<script src="../코드/그림/core.js"></script>
<script src="../코드/게임/data.js"></script>
<script src="../코드/게임/monsters.js"></script>
<script src="../코드/게임/mon_sprites.js"></script>
<script src="../코드/게임/mon_assets_forest.js"></script>
<script src="../코드/게임/mon_assets_r2.js"></script>
<script src="../코드/게임/mon_assets_r3.js"></script>
<script src="../코드/게임/mon_assets_r4.js"></script>
<script src="../코드/게임/props.js"></script>
<script>
'use strict';
const ROLE_N = { swarm: '무리', tank: '탱커', ranged: '원거리', charger: '돌격', boss: '보스' };
const SIZE_N = { s: '작음', m: '보통', l: '큼', b: '보스' };
const sizeOfH = h => (h <= 15 ? 's' : h <= 19 ? 'm' : h <= 23 ? 'l' : 'b');
let zoom = 3, motion = 'walk'; const lineups = [], cardCvs = [];
// 게임과 같은 움직임 프레임 (코드/게임/render.js drawFoe와 같은 빠르기). 느리게 = 1/4 빠르기
function frameOf(d, t, seed) {
  const A = monFrames(d), n = A.frames.length;
  const i = motion === 'stop' ? 0 : Math.floor(t * A.fps * (motion === 'slow' ? 0.25 : 1) + seed * n) % n;
  return { img: A.frames[i], bob: A.bob[i] };
}
function el(t, c, x) { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }

REGIONS.forEach((reg, ri) => {
  const sec = el('section'), h2 = el('h2', '', `${ri + 1}. ${reg.n}`);
  h2.append(el('small', '', `${stageLabel(ri * 10 + 1)} ~ ${stageLabel(ri * 10 + 10)}`));
  sec.append(h2, el('div', 'story', reg.hint));
  const cv = el('canvas', 'lineup'); sec.append(cv); lineups.push({ cv, reg, ri });
  const cards = el('div', 'cards');
  [...reg.mons, reg.boss].forEach(id => {
    const d = MON[id], a = forgeArt(d), boss = id === reg.boss, sz = boss ? 'b' : sizeOfH(a.h);
    const card = el('div', 'card' + (boss ? ' boss' : '')), c = el('canvas');
    const side = Math.max(a.c.width, a.c.height) + 6; c.width = c.height = side;
    cardCvs.push({ c, d, sz, side, seed: cardCvs.length * 1.7 });
    const info = el('div'); info.append(el('b', '', d.n));
    info.append(el('span', 'tag', boss ? '보스' : ROLE_N[d.role]), el('span', 'tag ' + sz, SIZE_N[sz]), el('span', 'tag', `${a.c.width}×${a.c.height}${d.hd ? ' 고해상' : ''}`));
    if (d.fly) info.append(el('span', 'tag', '떠다님'));
    card.append(c, info); cards.append(card);
  });
  sec.append(cards); document.getElementById('list').append(sec);
});

// 줄 세운 그림: 땅 + 소품(무테) + 용사 + 몬스터 5종, 살짝 숨쉬기
function drawLineup({ cv, reg, ri }, t) {
  const mons = [...reg.mons, reg.boss].map(id => forgeArt(MON[id]));
  const gap = 14, heroW = 36, W2 = 20 + heroW + gap + mons.reduce((s, a) => s + a.w * 2 + gap, 0) + 10, H2 = 78;
  if (cv.width !== W2 * zoom) { cv.width = W2 * zoom; cv.height = H2 * zoom; }
  const g = cv.getContext('2d'); g.setTransform(zoom, 0, 0, zoom, 0, 0); g.imageSmoothingEnabled = false;
  const [top, mid, dark] = reg.ground, GY = H2 - 10;
  const sky = g.createLinearGradient(0, 0, 0, GY); sky.addColorStop(0, '#1a2a5a'); sky.addColorStop(1, '#3a5aa8'); g.fillStyle = sky; g.fillRect(0, 0, W2, H2);
  g.globalAlpha = 0.6; reg.props.forEach((p, i) => { const a = forgeArt(PROP[p]); g.drawImage(a.c, 30 + i * (W2 / 4), GY - a.h * 2 + 2, a.w * 2, a.h * 2); }); g.globalAlpha = 1;
  g.fillStyle = mid; g.fillRect(0, GY, W2, H2 - GY); g.fillStyle = top; g.fillRect(0, GY, W2, 3);
  for (let x = 0; x < W2; x += 16) { g.fillStyle = dark; g.fillRect(x + 5, GY + 6, 4, 2); }
  let x = 20;
  g.fillStyle = 'rgba(74,48,80,0.25)'; g.fillRect(x + 4, GY - 2, 24, 3);
  const hs = sprite('heroA', 'hero'); g.drawImage(hs, x + 18 - hs.width, GY - hs.height * 2, hs.width * 2, hs.height * 2); // 몸 가운데 = x + 18
  const f = forge(DESIGNS.s0, 45); g.drawImage(f.c, x + 18 + HAND_DX - f.S, GY - 16 - f.S, f.S * 2, f.S * 2);
  x += heroW + gap;
  mons.forEach((a, i) => {
    // 게임과 같게: 늘이지 않고 걷기 프레임만 넘기며, 발바닥은 땅에 1px 묻는다
    const id = [...reg.mons, reg.boss][i], d = MON[id], sz = id === reg.boss ? 'b' : sizeOfH(a.h), k = d.hd ? 1 : 2;
    const { img, bob } = frameOf(d, t, i * 1.3), w = img.width * k, h = img.height * k;
    const fy = GY + (d.foot || 0) * k + bob * k + (d.fly ? -(d.fly + Math.round(Math.sin(t * 3 + i))) : 1);
    g.fillStyle = 'rgba(74,48,80,0.25)'; g.fillRect(x + a.w * 0.3, GY - 2, a.w * 1.4, 3);
    g.drawImage(img, Math.round(x + (a.w * 2 - w) / 2), Math.round(fy - h), w, h);
    x += a.w * 2 + gap;
  });
}
function drawCard({ c, d, sz, side, seed }, t) {
  const g = c.getContext('2d'), { img, bob } = frameOf(d, t, seed);
  g.clearRect(0, 0, side, side);
  g.fillStyle = 'rgba(255,220,160,0.25)'; g.fillRect(0, side - 2, side, 1); // 땅 줄
  g.drawImage(img, Math.floor((side - img.width) / 2), side - 2 - img.height + 1 + (d.foot || 0) + bob);
}
function loop(now) { const t = now / 1000; for (const l of lineups) drawLineup(l, t); for (const c of cardCvs) drawCard(c, t); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
document.getElementById('motion').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; motion = b.dataset.v; e.currentTarget.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); });
document.getElementById('zoom').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; zoom = +b.dataset.v; e.currentTarget.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); });
</script>
</body>
</html>
